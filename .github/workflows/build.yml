name: Build Go binaries

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Test
        working-directory: src
        run: go test ./... -count=1 -race

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: linux
            goos: linux
            goarch: amd64
            ext: ""
          - target: windows
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Derive version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X tcc/cmd.Version=${{ steps.version.outputs.value }}" \
            -o tcc${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tcc-${{ matrix.target }}-${{ matrix.goarch }}
          path: src/tcc${{ matrix.ext }}

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - uses: go-semantic-release/action@v1
        id: semver
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-bump-patch-version: true
          allow-initial-development-versions: true

      - uses: actions/download-artifact@v7
        if: steps.semver.outputs.version != ''
        with:
          pattern: tcc-*-amd64
          merge-multiple: true

      - name: Prepare release assets
        if: steps.semver.outputs.version != ''
        run: |
          mkdir -p dist
          mv tcc       dist/tcc-linux-amd64
          mv tcc.exe   dist/tcc-windows-amd64.exe
          cd dist
          sha256sum * > checksums.txt

      - name: Upload assets to release
        if: steps.semver.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.semver.outputs.version }}" dist/* --clobber
