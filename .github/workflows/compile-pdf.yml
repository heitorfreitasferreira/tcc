name: Compile LaTeX PDF

on:
  push:
    branches: [main, master]
    paths:
      - 'monografia/**'
      - '.github/workflows/compile-pdf.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'monografia/**'
      - '.github/workflows/compile-pdf.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX Live
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "postinst_format-disabled" | sudo tee /var/lib/texmf/postinst.formats-disabled
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-lang-portuguese \
            texlive-publishers \
            texlive-fonts-recommended \
            texlive-pictures

      - name: Compile monograph
        working-directory: monografia
        run: latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error main_ppgco_ufu.tex

      - name: Upload PDF (Actions artifact)
        uses: actions/upload-artifact@v5
        with:
          name: monografia
          path: monografia/main_ppgco_ufu.pdf

  release:
    needs: compile
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semantic Release (monografia)
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL \
            https://github.com/go-semantic-release/semantic-release/releases/latest/download/semantic-release_linux_amd64 \
            -o /tmp/semantic-release
          chmod +x /tmp/semantic-release

          echo "0.0.0" > /tmp/monografia-version

          /tmp/semantic-release \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --tag-prefix monografia-v \
            --allow-initial-development-versions \
            --force-bump-patch-version \
            --update-file /tmp/monografia-version \
            2>&1 || true

          VERSION=$(cat /tmp/monografia-version)
          if echo "$VERSION" | grep -qP '^\d+\.\d+\.\d+$' && [ "$VERSION" != "0.0.0" ]; then
            echo "tag=monografia-v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.semver.outputs.tag != ''
        with:
          name: monografia
          path: .

      - name: Upload PDF to release
        if: steps.semver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.semver.outputs.tag }}" main_ppgco_ufu.pdf --clobber
