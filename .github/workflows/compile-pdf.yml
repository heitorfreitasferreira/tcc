name: Compile LaTeX PDF

on:
  push:
    branches: [main, master]
    paths:
      - 'monografia/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'monografia/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-tex-${{ hashFiles('.github/workflows/compile-pdf.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-tex-

      - name: Install TeX Live
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Evita gerar todos os formatos na instalação (~40s no runner).
          echo "postinst_format-disabled" | sudo tee /var/lib/texmf/postinst.formats-disabled
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-lang-portuguese \
            texlive-publishers \
            texlive-fonts-recommended \
            texlive-pictures

      - name: Compile monograph
        working-directory: monografia
        run: latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error main_ppgco_ufu.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: monografia
          path: monografia/main_ppgco_ufu.pdf
